name: Build Windows exe

# Every push to main builds the installer and portable exe.
# When overlay/package.json has a version with no release yet (e.g. you bump 1.2.0 -> 1.3.0),
# the build is published as release v<version>. Otherwise the exes are attached to the run as
# a download (Actions tab -> the run -> Artifacts).
# "Run workflow" on the Actions tab does the same on demand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      - name: Build installer and portable exe
        run: npm run dist

      # Stop before releasing if the packaged app is missing a file its code needs
      # (1.4.0 shipped without lobby.js and crashed on start).
      - name: Check the packaged app is complete
        run: node tools/check-package.js dist/win-unpacked/resources/app.asar

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mercify-${{ steps.version.outputs.version }}-windows
          path: |
            overlay/dist/*.exe
            overlay/dist/latest.yml
            overlay/dist/*.blockmap
          if-no-files-found: error

      - name: Publish release
        if: steps.released.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mercify ${{ steps.version.outputs.version }}
          # latest.yml and the .blockmap tell installed copies of Mercify about the update
          # (and let them download only the parts that changed).
          files: |
            overlay/dist/*.exe
            overlay/dist/latest.yml
            overlay/dist/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
