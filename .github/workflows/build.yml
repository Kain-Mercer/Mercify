name: Build Windows exe

# Every push to main builds the installer and portable exe.
# When overlay/package.json has a version with no release yet (e.g. you bump 1.2.0 -> 1.3.0),
# the build is published as release v<version>. Otherwise the exes are attached to the run as
# a download (Actions tab -> the run -> Artifacts).
# "Run workflow" on the Actions tab does the same on demand; on any other branch it only
# attaches the exes to the run, so a fix can be tried before it's merged.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      test_release:
        description: "Test pre-release name, e.g. test.1 (publishes v<version>-test.1 from a non-main branch; installed copies never update to it)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Is this version already released?
        id: released
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      # The window-in-front reporting that the "only show over these apps" gate runs on
      # (1.6.0 shipped with it dropping the game's window and monitor).
      - name: Test foreground reporting
        run: node tools/fg-test.js

      # Friends and friend requests through lobbies, against stand-in relays.
      - name: Test friends
        run: node tools/friends-test.js

      - name: Build installer and portable exe
        run: npm run dist

      # Stop before releasing if the packaged app is missing a file its code needs
      # (1.4.0 shipped without lobby.js and crashed on start).
      - name: Check the packaged app is complete
        run: node tools/check-package.js dist/win-unpacked/resources/app.asar

      # Fixed-name copies, so links can always point at the newest release:
      #   https://github.com/<repo>/releases/latest/download/Mercify-Setup.exe
      # (the README's download buttons). The versioned files stay exactly as they are:
      # latest.yml names them, and installed copies update from that.
      - name: Fixed-name copies for "latest" download links
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          cp "dist/Mercify-Setup-$v.exe" dist/Mercify-Setup.exe
          cp "dist/Mercify-$v-portable.exe" dist/Mercify-portable.exe

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mercify-${{ steps.version.outputs.version }}-windows
          path: |
            overlay/dist/*.exe
            overlay/dist/latest.yml
            overlay/dist/*.blockmap
          if-no-files-found: error

      # Only main publishes. A run on another branch (Run workflow on a fix branch, to try a
      # build before merging) just attaches the exes to the run.
      - name: Publish release
        if: steps.released.outputs.exists == 'false' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mercify ${{ steps.version.outputs.version }}
          # latest.yml and the .blockmap tell installed copies of Mercify about the update
          # (and let them download only the parts that changed).
          files: |
            overlay/dist/*.exe
            overlay/dist/latest.yml
            overlay/dist/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true

      # A test build to share before releasing: Run workflow on a branch with "test_release" set.
      # Pre-releases are ignored by installed copies' updater and by the README's "latest" links.
      - name: Publish test pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.test_release != '' && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ inputs.test_release }}
          target_commitish: ${{ github.sha }}
          name: Mercify ${{ steps.version.outputs.version }} (${{ inputs.test_release }})
          prerelease: true
          make_latest: false
          body: |
            Test build from the `${{ github.ref_name }}` branch. Not a regular release: installed copies of Mercify won't update to it.

            Download **Mercify-portable.exe** and run it (nothing to install).
          files: |
            overlay/dist/Mercify-portable.exe
            overlay/dist/Mercify-Setup-${{ steps.version.outputs.version }}.exe
          fail_on_unmatched_files: true
