name: Build Windows exe

# Push a tag like v1.2.0 to build and publish a release.
# "Run workflow" on the Actions tab builds without releasing (download it from the run's Artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - name: Install
        run: npm ci

      - name: Build installer and portable exe
        run: npm run dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Mercify-windows
          path: overlay/dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: overlay/dist/*.exe
          generate_release_notes: true
