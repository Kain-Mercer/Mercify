name: Check lobby relays

# Runs the three-member lobby test against the real public relays that listening lobbies use.
# Start it from the Actions tab ("Run workflow") if lobbies seem broken; it also runs weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  relays:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Each relay on its own
        shell: bash
        run: |
          for r in $(node -p "require('./lobby').DEFAULT_RELAYS.join(' ')"); do
            echo "::group::$r"
            if LOBBY_RELAYS="$r" LOBBY_CONNECT_TIMEOUT_MS=30000 SKIP_CRASH=1 node tools/lobby-test.js > out.txt 2>&1; then
              echo "::notice title=Relay OK::$r ($(grep -c '^PASS' out.txt) checks passed)"
            else
              echo "::warning title=Relay DOWN::$r: $(grep -E '^FAIL|Error' out.txt | head -3 | tr '\n' ' ')"
            fi
            cat out.txt
            echo "::endgroup::"
          done

      - name: All relays together (as the app uses them)
        shell: bash
        run: |
          set +e
          node tools/lobby-test.js > all.txt 2>&1
          code=$?
          cat all.txt
          grep -E '^FAIL' all.txt | while read -r line; do echo "::error title=Lobby check failed::$line"; done
          echo "::notice title=All relays together::$(tail -1 all.txt) ($(grep -c '^PASS' all.txt) checks passed)"
          exit $code
